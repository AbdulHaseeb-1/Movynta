<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movynta</title>
    <link rel="icon" type="image/x-icon" href="/logo/favicon.ico" />
    <style>
      body { margin: 0; background: #191919; }
      .startup-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #191919; opacity: 1; transition: opacity 400ms ease; }
      .startup-splash.is-exiting { opacity: 0; pointer-events: none; }
      .startup-mark { position: relative; width: min(128px, 32vw); animation: splash-appear 500ms ease both; }
      .startup-mark img { display: block; width: 100%; height: auto; }
      .startup-mark .startup-mark-base { opacity: 0.3; }
      .startup-mark .startup-mark-loader { position: absolute; inset: 0; }
      @keyframes splash-appear { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .startup-splash { transition: none; }
        .startup-mark { animation: none; }
        .startup-mark .startup-mark-base { opacity: 1; }
        .startup-mark .startup-mark-loader { display: none; }
      }
    </style>
  </head>

  <body>
    <div id="startup-splash" class="startup-splash" role="status" aria-label="Loading Movynta">
      <div class="startup-mark">
        <img class="startup-mark-base" src="/logo/movynta.svg" alt="" />
        <img class="startup-mark-loader" src="/logo/movynta-loader.svg" alt="" />
      </div>
    </div>
    <div id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
